<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Oráculo Sales Copilot</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ea043;
      box-shadow: 0 0 6px #2ea043;
    }
    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
    }
    p {
      margin: 0 0 10px 0;
      color: #8b949e;
      font-size: 12px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 0;
      background: #238636;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #2ea043;
    }
    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #30363d;
    }
    .footer {
      margin-top: 12px;
      font-size: 11px;
      color: #6e7681;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h2>Sales Copilot (Laya)</h2>
  </div>
  <p>O HUD é injetado automaticamente quando você abre uma reunião no <b>Google Meet</b> com legendas ativadas.</p>
  
  <button class="btn" id="open-sim-btn">🧪 Abrir Simulador de Teste</button>
  <button class="btn btn-secondary" id="open-meet-btn">📹 Abrir Google Meet</button>

  <div class="footer">
    Oráculo • Jordan Belford Straight Line
  </div>

  <script src="popup.js"></script>
</body>
</html>
