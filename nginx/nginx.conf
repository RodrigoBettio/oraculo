# ============================================================
# ORÁCULO - Nginx Reverse Proxy Configuration (Production & IP Ready)
# ============================================================

# Rate limiting para proteção básica
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Upstream para o FastAPI
upstream oraculo_app {
    server app:8000;
}

# Servidor HTTP Principal (Acessível diretamente pelo IP da VM ou Domínio)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Limites de upload (para vídeos se necessário)
    client_max_body_size 500M;

    # Certbot challenge (para quando configurar domínio com HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Arquivos estáticos servidos diretamente pelo Nginx
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Rate limit na autenticação OAuth
    location /auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://oraculo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API com rate limiting moderado e timeout para vídeo
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://oraculo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Health check (sem rate limit)
    location /health {
        proxy_pass http://oraculo_app;
        access_log off;
    }

    # Todas as outras rotas → FastAPI
    location / {
        proxy_pass http://oraculo_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
