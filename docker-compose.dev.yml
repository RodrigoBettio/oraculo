# ============================================================
# ORÁCULO - Docker Compose (Override para Desenvolvimento)
# ============================================================
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./credentials:/app/credentials
    environment:
      - ENVIRONMENT=development
      - OAUTH_REDIRECT_URI=http://127.0.0.1:8000/auth/google/callback
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000 --reload

  # Sem Nginx em dev (acesso direto à porta 8000)
  nginx:
    profiles:
      - disabled
